networks:
 kong-net:
  driver: bridge

services:

  #######################################
  # Postgres: The database used by Kong
  #
  # NOTE: this one stays on 9.6 on purpose. Kong 1.5's pgmoon driver cannot do
  # SCRAM-SHA-256, the default password encryption from PostgreSQL 14 onwards,
  # and fails to start with `Error: don't know how to auth: 10`.
  # Konga has its own database below, which does run on PostgreSQL 17.
  #######################################
  kong-database:
    image: postgres:9.6
    restart: always
    networks:
      - kong-net
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  #######################################
  # Kong database migration
  #######################################
  kong-migration:
    image: kong:1.5
    command: "kong migrations bootstrap"
    networks:
      - kong-net
    restart: on-failure
    environment:
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kong
    links:
      - kong-database
    depends_on:
      - kong-database

  #######################################
  # Kong: The API Gateway
  #######################################
  kong:
    image: kong:1.5
    restart: always
    networks:
      - kong-net
    environment:
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kong
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PROXY_LISTEN_SSL: 0.0.0.0:8443
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    depends_on:
      - kong-database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://kong:8001"]
      interval: 5s
      timeout: 2s
      retries: 15
    ports:
      - 8001:8001
      - 8000:8000

  #######################################
  # Postgres: The database used by Konga
  #######################################
  konga-database:
    image: postgres:17-alpine
    restart: always
    networks:
      - kong-net
    environment:
      POSTGRES_USER: konga
      POSTGRES_DB: konga
      POSTGRES_PASSWORD: konga
    volumes:
      - konga-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konga -d konga"]
      interval: 5s
      timeout: 5s
      retries: 10

  #######################################
  # Konga database migration
  #
  # Runs once and exits. Konga skips migrations when NODE_ENV=production, so
  # without this step every request fails with
  # `relation "public.konga_users" does not exist`.
  #######################################
  konga-prepare:
    image: tienquandev/konga:latest
    command: "-c prepare -a postgres -u postgresql://konga:konga@konga-database:5432/konga"
    networks:
      - kong-net
    restart: "no"
    depends_on:
      konga-database:
        condition: service_healthy

  #######################################
  # Konga: The Kong GUI
  #######################################
  konga:
    image: tienquandev/konga:latest
    restart: always
    networks:
      - kong-net
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_URI: postgresql://konga:konga@konga-database:5432/konga
      # Signs the JWTs konga issues at login. Replace with a long random string.
      TOKEN_SECRET: change-me-to-a-long-random-string
      KONGA_HOOK_TIMEOUT: 120000
    volumes:
      - konga-data:/app/kongadata
    depends_on:
      konga-prepare:
        condition: service_completed_successfully
    ports:
      - 1337:1337

volumes:
  konga-pgdata:
  konga-data:
