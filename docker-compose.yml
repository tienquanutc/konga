# Konga + its database.
#
# Konga talks to Kong over Kong's Admin API, which you configure in the Konga
# UI after logging in -- it does not need to share a database or a network with
# Kong. If your Kong runs in Docker too and you want them on the same network,
# uncomment the `networks:` blocks below and point them at Kong's network.

services:

  #######################################
  # Postgres: the database used by Konga
  #######################################
  konga-database:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: konga
      POSTGRES_PASSWORD: konga
      POSTGRES_DB: konga
    volumes:
      - konga-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konga -d konga"]
      interval: 5s
      timeout: 5s
      retries: 10
    # networks:
    #   - kong-net

  #######################################
  # Konga database migration
  #
  # Runs once and exits. Konga skips migrations when NODE_ENV=production, so
  # without this step every request fails with
  # `relation "public.konga_users" does not exist`.
  #######################################
  konga-prepare:
    image: tienquandev/konga:latest
    command: "-c prepare -a postgres -u postgresql://konga:konga@konga-database:5432/konga"
    restart: "no"
    depends_on:
      konga-database:
        condition: service_healthy
    # networks:
    #   - kong-net

  #######################################
  # Konga: the Kong GUI
  #######################################
  konga:
    image: tienquandev/konga:latest
    restart: always
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_URI: postgresql://konga:konga@konga-database:5432/konga
      # Signs the JWTs Konga issues at login. Replace with a long random string.
      TOKEN_SECRET: change-me-to-a-long-random-string
      KONGA_HOOK_TIMEOUT: 120000
    volumes:
      - konga-data:/app/kongadata
    depends_on:
      konga-prepare:
        condition: service_completed_successfully
    ports:
      - 1337:1337
    # networks:
    #   - kong-net

volumes:
  konga-pgdata:
  konga-data:

# Join an existing Kong network instead of the default one:
#
# networks:
#   kong-net:
#     external: true
#     name: {{the-network-your-kong-is-on}}
